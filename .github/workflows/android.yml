name: Build APK

# Deliberately manual-only: no push, pull_request, tag, or scheduled builds.
on:
  workflow_dispatch:
    inputs:
      signed:
        description: Sign with the repository's release keystore secrets
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Temurin 21
        uses: actions/setup-java@v6
        with:
          java-version: '21.0.13+9'
          distribution: temurin
          cache: gradle
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;36.0.0'
      - name: Restore release keystore
        if: inputs.signed
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo 'Missing RELEASE_KEYSTORE_BASE64 secret' >&2; exit 1; }
          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vesper-release.jks"
      - name: Build unsigned release APK
        if: ${{ !inputs.signed }}
        run: ./scripts/build-release.sh
      - name: Build signed release APK
        if: inputs.signed
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/vesper-release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./scripts/build-release.sh
      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: V3SP3R-APK-${{ inputs.signed && 'signed' || 'unsigned' }}-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload R8 mapping for crash reports
        uses: actions/upload-artifact@v7
        with:
          name: V3SP3R-mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14
      - name: Remove release keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/vesper-release.jks"
