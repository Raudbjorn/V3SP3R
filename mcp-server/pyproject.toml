[project]
name = "vesper-mcp"
version = "0.1.0"
description = "FastMCP server exposing the M0MA-V3SP3R runbook corpus and Flipper Zero command schema."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "M0MA-V3SP3R contributors" }]
dependencies = [
    # mcp 2.0 dropped mcp.server.fastmcp; pin <2. Same rationale as
    # H4CKRF-6H05T, P1N3NUT5, PHR34CKER5.
    "mcp>=1.30.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
vesper-mcp = "vesper_mcp.__main__:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vesper_mcp"]

# Bundle the repo-root knowledge corpus + the interface schema into the
# wheel so `pip install vesper-mcp` (no repo checkout) still has both.
# Paths are resolved relative to this pyproject.toml.
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml", "hatch_build.py"]

[tool.hatch.build.targets.sdist.force-include]
"../knowledge" = "_bundled/knowledge"
"../docs/execute_command_schema.json" = "_bundled/docs/execute_command_schema.json"
"../README.md" = "_bundled/README.md"
"../LICENSE" = "LICENSE"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
