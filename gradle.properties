# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# AGP 9 compatibility: retain the external Kotlin plugin and legacy Android DSL.
# Revisit these opt-outs before upgrading to AGP 10.
android.builtInKotlin=false
android.newDsl=false

# Install debug builds as regular apps (not test-only), so they persist on device.
android.injected.testOnly=false
